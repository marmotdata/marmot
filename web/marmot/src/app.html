<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fdfbfa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)" />
		<script>
			// Must stay in <head> and stay in sync with src/lib/stores/theme.ts. Running it
			// before the page has any markup is what stops a light flash on every refresh.
			(() => {
				try {
					const saved = localStorage.getItem('theme');
					const isDark =
						saved === 'dark' ||
						((saved === 'auto' || saved === null) &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);

					if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
					document.documentElement.classList.toggle('dark', isDark);
					document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
				} catch {
					// localStorage can be unavailable; fall back to the light theme.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<script>
			// Polyfill for chrome object to prevent errors in non-Chrome browsers
			if (typeof chrome === 'undefined') {
				window.chrome = {};
			}
		</script>
	</body>
</html>
