[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marmot-sdk"
version = "0.3.0"
description = "Python SDK for Marmot — read the catalog and self-document automation, agents, and pipelines."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Marmot" }]
keywords = ["marmot", "catalog", "data", "lineage", "agents", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1",
    "typing-extensions>=4.7.1",
    "python-dateutil>=2.8.2",
    "pydantic>=2.11",
    "lazy-imports (>=1,<2)",
    "pyyaml>=6.0",
    "strenum",
]

[project.urls]
Homepage = "https://marmotdata.io"
Repository = "https://github.com/marmotdata/marmot"
Issues = "https://github.com/marmotdata/marmot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>= 2.8.1",
    "types-python-dateutil>= 2.8.19.14",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pip>=26.1.2",
    "pip-audit>=2.7",
]
langchain = [
    "langchain-core>=0.3",
]
claude-agent = [
    "claude-agent-sdk>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marmot"]
exclude = [
    "src/marmot/generated/test/",
]

[tool.hatch.build]
exclude = [
    "src/marmot/.openapi-generator/",
    "src/marmot/.openapi-generator-ignore",
    "src/marmot/generated/docs/",
    "*.md",
]
# Ruff handles linting + formatting. Includes pycodestyle (E/W), pyflakes (F),
# pyupgrade (UP), bugbear (B), bandit-equivalent security (S), naming (N),
# isort (I), simplify (SIM), pytest style (PT), pathlib (PTH), and more.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit (security)
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "RET",           # return statements
    "PIE",           # misc anti-patterns
    "PT",            # pytest style
    "TID",           # tidy imports
    "PTH",           # use pathlib
    "C90",           # mccabe complexity
    "PL",            # pylint subset
    "TRY",           # exception anti-patterns
]
ignore = [
    "E501",      # line length (handled by formatter)
    "A003",      # methods shadowing builtins (.list, .get — idiomatic for resource clients)
    "PLC0415",   # imports inside functions — deliberate for lazy/circular avoidance
    "PLR0911",   # too many returns — auth chain reads better as flat returns
    "PLR0913",   # too many arguments — option-heavy APIs need them
    "PLR2004",   # magic value comparisons (HTTP status codes etc.)
    "TRY003",    # long messages in exception classes — too noisy
    "TRY300",    # else clause on try — stylistic
    "TRY400",    # use logging.exception — not always logging
    "TRY301",    # raise within try — sometimes intentional
    "C901",      # function complexity — case-by-case via noqa where actually warranted
]

[tool.ruff.lint.pep8-naming]
# pydantic wraps these implicitly; without this N805's unsafe fix rewrites the
# generated validators' `cls` to `self`, which pydantic v2 rejects at import time.
classmethod-decorators = ["pydantic.field_validator", "pydantic.model_validator"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",      # assert OK in tests
    "S105",      # hardcoded passwords OK in tests
    "S106",      # hardcoded passwords in func args OK in tests
    "PLR2004",   # magic values OK in tests
]
"src/marmot/auth/__init__.py" = [
    "PLR0911",   # multiple returns are clear in the resolution chain
    "PLR0912",   # branches inherent to the resolution order
]
"examples/*" = [
    "PLR0912",   # smoketest is a long imperative script
    "PLR0915",   # ditto
    "PLW0108",   # `lambda: x.y()` shorthand for endpoint calls is readable
    "PLW0603",   # globals for pass/fail counters keep the script flat
    "BLE001",    # smoketest catches everything to keep running
    "T201",      # print is the point
]
"src/marmot/generated/*" = [
    "B904",  # except should raise from err
    "N802",  # function names should be lowercase
    "N818",  # exceptions should have an Error suffix
    "PTH",  # openapi-generator-cli does not use Pathlib
    "PLW",  # ignore pylint warning
    "PLR",  # ignore pylint refactor
    "RUF012",  #  mutable default value for class attribute
    "S101",  # assert
    "TRY004",  # prefer `TypeError` exception for invalid type
    "TRY203",  # remove exception handler; error is immediately re-raised
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "src/marmot/integrations",
    "src/marmot/generated/*",
    "tests",
    "dist",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
