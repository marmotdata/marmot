syntax = "proto3";

package marmot.serve.v1;

option go_package = "github.com/marmotdata/marmot/internal/pluginserve/proto";

// Plugin is served by `marmot ingest --serve` over the connection it opened to Marmot. Only Marmot calls it, and every call carries a Query signed by Marmot.
service Plugin {
  rpc PlanQuery(SignedQuery) returns (PlanQueryResponse);
  rpc ExecuteQuery(SignedQuery) returns (stream QueryChunk);
  // PlanTool and ExecuteTool carry a plugin tool. The serving process runs one only when its operator passed --allow-tools and a policy naming the source and the tool, and only within that policy, whatever Marmot signed.
  rpc PlanTool(SignedQuery) returns (ToolResponse);
  rpc ExecuteTool(SignedQuery) returns (ToolResponse);
  // WatchTriggers is opened by Marmot once per connection, with a Query for OPERATION_WATCH_TRIGGERS, and streams the events of the triggers the serving process's own policy runs until the connection closes. The Query names no trigger and carries no parameters: which triggers run, and with what, is the serving process's decision alone, and Marmot only receives what they find.
  rpc WatchTriggers(SignedQuery) returns (stream SignedTriggerEvent);
}

// Replica is served by every Marmot replica to the others, so a query that arrives at one replica reaches the replica the plugin is connected to. It takes a SignedForward rather than a bare ForwardedQuery, so a replica certificate alone is not enough to have a replica sign queries; the change is not wire compatible with replicas that sent bare forwards, which is acceptable because every replica of an instance runs the same release (a rolling upgrade only fails the forwards made across versions while it runs).
service Replica {
  rpc PlanQuery(SignedForward) returns (PlanQueryResponse);
  rpc ExecuteQuery(SignedForward) returns (stream QueryChunk);
  rpc PlanTool(SignedForward) returns (ToolResponse);
  rpc ExecuteTool(SignedForward) returns (ToolResponse);
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_PLAN = 1;
  OPERATION_EXECUTE = 2;
  // The tool operations are their own values rather than a flag beside plan and execute, so an envelope signed for one can never be presented as another: a serving process verifies the operation of the rpc it was called on.
  OPERATION_TOOL_PLAN = 3;
  OPERATION_TOOL_EXECUTE = 4;
  OPERATION_WATCH_TRIGGERS = 5;
}

// Query is one instruction to a serving plugin. Marmot serialises it once and signs those bytes; the plugin verifies the signature before parsing and acts only on what was signed.
message Query {
  uint32 version = 1;
  // issuer is the Marmot instance id the plugin enrolled with.
  string issuer = 2;
  // audience is the SPIFFE ID in the serving process's certificate.
  string audience = 3;
  Operation operation = 4;
  string source = 5;
  string statement = 6;
  int64 max_rows = 7;
  // actor is the audit subject of the principal running the query.
  string actor = 8;
  // query_id is the query's id in Marmot's query log, empty for plans, or for a tool its id in Marmot's log when it keeps one.
  string query_id = 9;
  int64 issued_at_unix = 10;
  int64 expires_at_unix = 11;
  bytes nonce = 12;
  // channel_binding is the RFC 9266 tls-exporter value of the connection the query is sent on.
  bytes channel_binding = 13;
  // origin names what caused the query in Marmot, such as task_run:<id>, so the serving process's audit can be traced back to it.
  string origin = 14;
  // receipt_wanted asks the serving process to end an execute with a signed Receipt. Marmot releases that predate receipts leave it unset, and a serving process sends none to them, because they would read the receipt chunk as rows.
  bool receipt_wanted = 15;
  // tool, params_json, precondition and manifest_digest are set for the tool operations only. params_json is the tool's parameters as a JSON object; the serving process hashes these exact bytes into its receipt.
  string tool = 16;
  bytes params_json = 17;
  // precondition is the token from the plan being executed, binding an execute to the state its plan looked at.
  string precondition = 18;
  // manifest_digest is the ManifestDigest of the tool manifest Marmot believes it is asking against. The serving process computes the digest from its own plugin and refuses on any difference, so a plugin whose tools changed is never driven by a request written for the old ones.
  string manifest_digest = 19;
  // approval is a serialised Approval, for TOOL_EXECUTE of a write only. The serving process checks every assertion in it against the approvers in its own policy and over an ApprovalDigest it computes from this Query, never one Marmot sends. A serving process that predates approvals refuses nothing for want of one, so a policy that relies on approvals needs a release that checks them.
  bytes approval = 20;
}

message SignedQuery {
  bytes query = 1;
  bytes signature = 2;
}

// ForwardedQuery travels between replicas over mutual TLS, serialised and signed with the instance's query signing key inside a SignedForward. The receiving replica verifies it, then builds and signs the Query for its own connection to the plugin, reusing nonce as that Query's nonce so the forwarding replica can match the plugin's receipt to what it asked for.
message ForwardedQuery {
  Operation operation = 1;
  string source = 2;
  string statement = 3;
  int64 max_rows = 4;
  string actor = 5;
  string query_id = 6;
  string origin = 7;
  uint32 version = 8;
  // issuer is the Marmot instance id; audience is the SPIFFE ID of the replica the forward is for.
  string issuer = 9;
  string audience = 10;
  int64 issued_at_unix = 11;
  int64 expires_at_unix = 12;
  bytes nonce = 13;
  string tool = 14;
  bytes params_json = 15;
  string precondition = 16;
  string manifest_digest = 17;
  // approval is a serialised Approval, as on Query, copied untouched into the Query the receiving replica signs.
  bytes approval = 18;
}

message SignedForward {
  bytes forward = 1;
  bytes signature = 2;
}

// Receipt is the serving process's signed account of one execute, sent as the last chunk of the stream. It is signed with the private key of the connection's client certificate, so it verifies against this instance's CA and names the enrolment that served it.
message Receipt {
  uint32 version = 1;
  string query_id = 2;
  string origin = 3;
  string source = 4;
  string actor = 5;
  bytes statement_sha256 = 6;
  // nonce is the signed Query's nonce, tying the receipt to one query.
  bytes nonce = 7;
  int64 rows = 8;
  int64 duration_ms = 9;
  string error = 10;
  int64 finished_at_unix = 11;
  // max_rows is the row limit the serving process applied: the signed one, or lower when its local policy lowered it.
  int64 max_rows = 12;
}

message SignedReceipt {
  bytes receipt = 1;
  bytes signature = 2;
  // certificate is the serving process's leaf certificate, DER, so the receipt can be verified later against the instance's CA.
  bytes certificate = 3;
}

message PlanQueryResponse {
  bytes plan_json = 1;
}

// ToolReceipt is the serving process's signed account of one tool it planned or executed, carried in a SignedReceipt like a query's Receipt. It is its own message, signed under its own domain, so a query receipt can never be passed off as a tool's or the other way round.
message ToolReceipt {
  uint32 version = 1;
  Operation operation = 2;
  // id is the tool's id in Marmot's log, when it keeps one.
  string id = 3;
  string origin = 4;
  string source = 5;
  string actor = 6;
  string tool = 7;
  // params_sha256 is the SHA-256 of the signed params_json, byte for byte.
  bytes params_sha256 = 8;
  string precondition = 9;
  // manifest_digest is the digest of the plugin's manifest as the serving process computed it, which it only acts on when it equals the one Marmot signed.
  string manifest_digest = 10;
  bytes nonce = 11;
  // target and summary are what the plugin's plan or result said it touched and did.
  string target = 12;
  string summary = 13;
  string error = 14;
  // output_sha256 is the SHA-256 of the response's output_json, so the plan or result Marmot reads is the one the serving process signed for.
  bytes output_sha256 = 15;
  int64 duration_ms = 16;
  int64 finished_at_unix = 17;
  // approval_digest is the ApprovalDigest the serving process verified the approval over, empty when the tool needed and carried none.
  bytes approval_digest = 18;
  // approvers are the people the approval named, as it named them.
  repeated Approver approvers = 19;
  // approval_trust is how the serving process verified the approval: "marmot" for an approval Marmot signed. Empty when there was none. It is stated on every receipt so nobody mistakes a Marmot-signed approval for stronger protection.
  string approval_trust = 20;
}

// Approver is one person who approved, as Marmot identifies them.
message Approver {
  string user_id = 1;
  string name = 2;
  int64 approved_at_unix = 3;
}

// Approval is Marmot's statement that the named people approved exactly this tool: signed with Marmot's approval key, a key of its own that never signs queries, over ApprovalSignedMessage, which covers the ApprovalDigest of the tool (expires_at_unix included) and every approver. The serving process recomputes the digest from the Query it received, so the approval can only ever be spent on that tool.
message Approval {
  uint32 version = 1;
  int64 expires_at_unix = 2;
  repeated Approver approvers = 3;
  // signature is ASN.1 ECDSA P-256 over the SHA-256 of ApprovalSignedMessage.
  bytes signature = 4;
}

// TriggerEvent is one event a trigger in the serving process found, signed like a receipt with the connection's key, under a domain of its own.
message TriggerEvent {
  uint32 version = 1;
  string source = 2;
  string trigger = 3;
  string target_kind = 4;
  string target_namespace = 5;
  string target_name = 6;
  // facts_json is a JSON object of strings, whole numbers and booleans, bounded by the plugin SDK's CheckTriggerFacts.
  bytes facts_json = 7;
  int64 observed_at_unix = 8;
  // fingerprint is the plugin's, the same for every event about the same condition on the same object.
  string fingerprint = 9;
  // detail is free text from the watched system, at most 512 bytes, and never to be trusted.
  string detail = 10;
  // nonce is the WatchTriggers Query's nonce, which ties the event to the stream Marmot opened.
  bytes nonce = 11;
  // sequence counts the events on one stream from 1, so a replayed or reordered event is refused.
  uint64 sequence = 12;
  string triggers_digest = 13;
  int64 sent_at_unix = 14;
}

message SignedTriggerEvent {
  bytes event = 1;
  bytes signature = 2;
  // certificate is the serving process's leaf certificate, DER, as on SignedReceipt.
  bytes certificate = 3;
}

// ToolResponse answers PlanTool and ExecuteTool once the tool reached the plugin, whether it succeeded or not. A refusal by the serving process is a PermissionDenied error instead, with no receipt, because nothing ran.
message ToolResponse {
  // output_json is the plan for TOOL_PLAN and the result for TOOL_EXECUTE, empty when the plugin failed.
  bytes output_json = 1;
  SignedReceipt receipt = 2;
  // code is the gRPC code of the plugin's failure, zero when it succeeded. The failure's message is the receipt's error, which is signed; the code is not, and only classifies it.
  uint32 code = 3;
}

// QueryChunk carries either rows or, as the very last message of an execute, the serving process's receipt.
message QueryChunk {
  bytes chunk_json = 1;
  SignedReceipt receipt = 2;
}
