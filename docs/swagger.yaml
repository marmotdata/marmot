definitions:
  APIKey:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      key:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        description: Prefix is the start of the key kept in clear so a key can be
          recognised in a list after its secret is gone; empty for keys issued before
          it was stored.
        type: string
      user_id:
        type: string
    type: object
  AWSCredentialStatus:
    properties:
      available:
        type: boolean
      error:
        type: string
      sources:
        items:
          type: string
        type: array
    type: object
  AcceptInviteRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  ActivityResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/Bucket'
        type: array
    type: object
  AddDataProductAssetsRequest:
    properties:
      asset_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - asset_ids
    type: object
  AddMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  AddRelatedTermRequest:
    properties:
      term_id:
        type: string
    required:
    - term_id
    type: object
  AddTermsRequest:
    properties:
      term_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - term_ids
    type: object
  AgentRun:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      duration_ms:
        type: integer
      ended_at:
        type: string
      error:
        type: string
      id:
        type: string
      model:
        type: string
      prompt:
        description: Prompt is what the run was asked, such as a ticket's subject,
          so a list of runs reads as the questions they answered.
        type: string
      run_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      tokens_in:
        type: integer
      tokens_out:
        type: integer
      tool_calls:
        items:
          $ref: '#/definitions/ToolCall'
        type: array
    type: object
  AggregatedMetric:
    properties:
      aggregation_type:
        type: string
      bucket_end:
        type: string
      bucket_size:
        type: integer
      bucket_start:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      value:
        type: number
    type: object
  Asset:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      environments:
        additionalProperties:
          $ref: '#/definitions/Environment'
        type: object
      external_links:
        items:
          $ref: '#/definitions/AssetExternalLink'
        type: array
      has_run_history:
        type: boolean
      id:
        type: string
      is_stub:
        type: boolean
      last_sync_at:
        type: string
      metadata:
        additionalProperties: true
        type: object
      mrn:
        type: string
      name:
        type: string
      parent_mrn:
        type: string
      providers:
        items:
          type: string
        type: array
      query:
        type: string
      query_language:
        type: string
      schema:
        additionalProperties:
          type: string
        type: object
      sources:
        items:
          $ref: '#/definitions/AssetSource'
        type: array
      tags:
        items:
          type: string
        type: array
      terms:
        description: |-
          Terms carries glossary term names a discovery assigned to this
          asset. It is input only: the links live in asset_terms, so reading
          an asset back from the database never fills this in.
        items:
          type: string
        type: array
      type:
        type: string
      updated_at:
        type: string
      user_description:
        type: string
    type: object
  AssetCount:
    properties:
      asset_id:
        type: string
      asset_name:
        type: string
      asset_provider:
        type: string
      asset_type:
        type: string
      count:
        type: integer
    type: object
  AssetExternalLink:
    properties:
      icon:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  AssetRule:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      created_by_name:
        type: string
      description:
        type: string
      id:
        type: string
      is_enabled:
        type: boolean
      last_reconciled_at:
        type: string
      links:
        items:
          $ref: '#/definitions/AssetRuleExternalLink'
        type: array
      membership_count:
        type: integer
      metadata_field:
        type: string
      name:
        type: string
      pattern_type:
        type: string
      pattern_value:
        type: string
      priority:
        type: integer
      query_expression:
        type: string
      reconciliation_hash:
        type: string
      rule_type:
        $ref: '#/definitions/RuleType'
      term_ids:
        items:
          type: string
        type: array
      updated_at:
        type: string
      updated_by:
        type: string
      updated_by_name:
        type: string
    type: object
  AssetRuleAsset:
    properties:
      id:
        type: string
      mrn:
        type: string
      name:
        type: string
      providers:
        items:
          type: string
        type: array
      type:
        type: string
    type: object
  AssetRuleAssetsResponse:
    properties:
      asset_ids:
        items:
          type: string
        type: array
      assets:
        items:
          $ref: '#/definitions/AssetRuleAsset'
        type: array
      total:
        type: integer
    type: object
  AssetRuleExternalLink:
    properties:
      icon:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  AssetRuleListResult:
    properties:
      asset_rules:
        items:
          $ref: '#/definitions/AssetRule'
        type: array
      total:
        type: integer
    type: object
  AssetSearchResponse:
    properties:
      assets:
        items:
          $ref: '#/definitions/Asset'
        type: array
      filters:
        $ref: '#/definitions/AvailableFilters'
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  AssetSource:
    properties:
      last_sync_at:
        type: string
      name:
        type: string
      priority:
        type: integer
      properties:
        additionalProperties: true
        type: object
    type: object
  AssetSummaryResponse:
    properties:
      providers:
        additionalProperties:
          type: integer
        type: object
      tags:
        additionalProperties:
          type: integer
        type: object
      types:
        additionalProperties:
          $ref: '#/definitions/AssetTypeSummary'
        type: object
    type: object
  AssetTabCounts:
    properties:
      agent_runs:
        description: AgentRuns counts the runs of an agent asset.
        type: integer
      lineage:
        description: Lineage counts the distinct assets one edge away, upstream or
          downstream.
        type: integer
      queries:
        description: Queries counts queries through Marmot that read the asset in
          the last 14 days.
        type: integer
      runs:
        description: Runs counts the distinct pipeline runs recorded against the asset.
        type: integer
    type: object
  AssetTerm:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      created_by_username:
        type: string
      definition:
        type: string
      source:
        description: '"user" or "plugin:name"'
        type: string
      term_id:
        type: string
      term_name:
        type: string
    type: object
  AssetTermLink:
    properties:
      asset_id:
        type: string
      rule_id:
        type: string
      rule_name:
        type: string
      source:
        description: Source is "manual" or "rule".
        type: string
    type: object
  AssetTermLinkGroup:
    properties:
      count:
        type: integer
      rule_id:
        type: string
      rule_name:
        type: string
      source:
        type: string
    type: object
  AssetTypeSummary:
    properties:
      count:
        type: integer
      service:
        type: string
    type: object
  AssetsByOwnerResponse:
    properties:
      assets:
        additionalProperties:
          format: int64
          type: integer
        type: object
    type: object
  AssetsByProviderResponse:
    properties:
      assets:
        additionalProperties:
          format: int64
          type: integer
        type: object
    type: object
  AssetsByTermResponse:
    properties:
      assets:
        items:
          $ref: '#/definitions/Asset'
        type: array
      groups:
        items:
          $ref: '#/definitions/AssetTermLinkGroup'
        type: array
      links:
        items:
          $ref: '#/definitions/AssetTermLink'
        type: array
      total:
        type: integer
    type: object
  AssetsByTypeResponse:
    properties:
      assets:
        additionalProperties:
          format: int64
          type: integer
        type: object
    type: object
  AssetsOwnedResponse:
    properties:
      count:
        type: integer
      percentage:
        type: number
      total:
        type: integer
    type: object
  AssetsWithSchemasResponse:
    properties:
      count:
        type: integer
      percentage:
        type: number
      total:
        type: integer
    type: object
  AuthConfig:
    properties:
      enabled_providers:
        items:
          type: string
        type: array
    type: object
  AvailableFilters:
    properties:
      providers:
        additionalProperties:
          type: integer
        type: object
      tags:
        additionalProperties:
          type: integer
        type: object
      types:
        additionalProperties:
          type: integer
        type: object
    type: object
  BannerResponse:
    properties:
      dismissible:
        type: boolean
      enabled:
        type: boolean
      id:
        type: string
      message:
        type: string
      variant:
        type: string
    type: object
  BatchAssetResult:
    properties:
      asset: {}
      error:
        type: string
      mrn:
        type: string
      name:
        type: string
      provider:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  BatchCreateRequest:
    properties:
      assets:
        items:
          $ref: '#/definitions/RunCreateAssetRequest'
        minItems: 1
        type: array
      config:
        $ref: '#/definitions/RawPluginConfig'
      documentation:
        items:
          $ref: '#/definitions/CreateDocRequest'
        type: array
      glossary_terms:
        items:
          $ref: '#/definitions/CreateGlossaryTermRequest'
        type: array
      lineage:
        items:
          $ref: '#/definitions/CreateLineageRequest'
        type: array
      pipeline_name:
        type: string
      run_history:
        items:
          $ref: '#/definitions/CreateRunHistoryRequest'
        type: array
      run_id:
        type: string
      source_name:
        type: string
      statistics:
        items:
          $ref: '#/definitions/CreateStatRequest'
        type: array
    required:
    - assets
    - pipeline_name
    - run_id
    - source_name
    type: object
  BatchCreateResponse:
    properties:
      assets:
        items:
          $ref: '#/definitions/BatchAssetResult'
        type: array
      documentation:
        items:
          $ref: '#/definitions/DocumentationResult'
        type: array
      lineage:
        items:
          $ref: '#/definitions/LineageResult'
        type: array
      stale_entities_removed:
        items:
          type: string
        type: array
    type: object
  BatchDocumentationRequest:
    properties:
      documentation:
        items:
          $ref: '#/definitions/Documentation'
        minItems: 1
        type: array
    required:
    - documentation
    type: object
  BatchDocumentationResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/BatchDocumentationResult'
        type: array
    type: object
  BatchDocumentationResult:
    properties:
      documentation:
        $ref: '#/definitions/Documentation'
      error:
        type: string
      status:
        type: string
    type: object
  BatchGetAssetsRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 200
        type: array
    required:
    - ids
    type: object
  BatchGetAssetsResponse:
    properties:
      assets:
        items:
          $ref: '#/definitions/Asset'
        type: array
    type: object
  BatchLineageResult:
    properties:
      edge:
        $ref: '#/definitions/LineageEdge'
      status:
        description: '"created", "duplicate", or "existing"'
        type: string
    type: object
  Bucket:
    properties:
      error:
        type: integer
      hour:
        type: string
      success:
        type: integer
    type: object
  CompleteRunRequest:
    properties:
      error:
        type: string
      run_id:
        type: string
      status:
        $ref: '#/definitions/RunStatus'
      summary:
        $ref: '#/definitions/RunSummary'
    required:
    - run_id
    - status
    type: object
  ConnectedApp:
    properties:
      client_id:
        type: string
      client_name:
        type: string
      created_at:
        type: string
      expires_at:
        description: ExpiresAt is when the newest token issued under the grant stops
          working, after which the client has to ask again.
        type: string
      last_authorised_at:
        type: string
      redirect_uri:
        type: string
      scope_descriptions:
        items:
          $ref: '#/definitions/OAuthScopeDescription'
        type: array
      scopes:
        items:
          type: string
        type: array
    type: object
  ConnectedAppsResponse:
    properties:
      apps:
        items:
          $ref: '#/definitions/ConnectedApp'
        type: array
    type: object
  ConnectionTestResult:
    properties:
      asset_types:
        additionalProperties:
          type: integer
        type: object
      assets:
        type: integer
      duration_ms:
        type: integer
      error:
        type: string
      lineage:
        type: integer
      succeeded:
        type: boolean
      tables:
        type: integer
      timed_out:
        type: boolean
    type: object
  CreateAPIKeyRequest:
    properties:
      expires_in_days:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  CreateAssetOwner:
    properties:
      id:
        type: string
      type:
        enum:
        - user
        - team
        type: string
    type: object
  CreateAssetRequest:
    properties:
      description:
        type: string
      environments:
        additionalProperties:
          $ref: '#/definitions/Environment'
        type: object
      external_links:
        items:
          $ref: '#/definitions/AssetExternalLink'
        type: array
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      owners:
        description: Owners are the users and teams to own the asset.
        items:
          $ref: '#/definitions/CreateAssetOwner'
        type: array
      providers:
        items:
          type: string
        type: array
      schema:
        additionalProperties:
          type: string
        type: object
      sources:
        items:
          $ref: '#/definitions/AssetSource'
        type: array
      tags:
        items:
          type: string
        type: array
      terms:
        description: Terms are the IDs of glossary terms to link the asset to.
        items:
          type: string
        type: array
      type:
        type: string
      user_description:
        description: UserDescription is the people-written description, kept apart
          from the source's own.
        type: string
    required:
    - name
    - providers
    - type
    type: object
  CreateAssetRuleRequest:
    properties:
      description:
        type: string
      is_enabled:
        type: boolean
      links:
        items:
          $ref: '#/definitions/AssetRuleExternalLink'
        type: array
      metadata_field:
        type: string
      name:
        type: string
      pattern_type:
        type: string
      pattern_value:
        type: string
      priority:
        type: integer
      query_expression:
        type: string
      rule_type:
        type: string
      term_ids:
        items:
          type: string
        type: array
    type: object
  CreateDataProductRequest:
    properties:
      description:
        type: string
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      owners:
        items:
          $ref: '#/definitions/DataProductOwnerRequest'
        type: array
      rules:
        items:
          $ref: '#/definitions/DataProductRuleRequest'
        type: array
      tags:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  CreateDocRequest:
    properties:
      asset_mrn:
        type: string
      content:
        type: string
      type:
        type: string
    type: object
  CreateGlossaryTermRequest:
    properties:
      definition:
        type: string
      description:
        type: string
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      parent:
        type: string
      synonyms:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
    type: object
  CreateLineageRequest:
    properties:
      job_mrn:
        type: string
      source:
        type: string
      target:
        type: string
      type:
        type: string
    type: object
  CreateRunHistoryRequest:
    properties:
      asset_mrn:
        type: string
      event_time:
        type: string
      event_type:
        type: string
      job_facets:
        additionalProperties: true
        type: object
      job_name:
        type: string
      job_namespace:
        type: string
      run_facets:
        additionalProperties: true
        type: object
      run_id:
        type: string
    type: object
  CreateSSOMappingRequest:
    properties:
      member_role:
        type: string
      provider:
        type: string
      role_id:
        description: RoleID is the Marmot role the group's members get at every sign-in,
          in place of the default role.
        type: string
      sso_group_name:
        type: string
      team_id:
        type: string
    type: object
  CreateScheduleRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      cron_expression:
        type: string
      description:
        description: Description says what the pipeline catalogs. Omit it to leave
          it unchanged; an empty string clears it.
        type: string
      enabled:
        type: boolean
      ingest_on_query:
        description: |-
          IngestOnQuery refreshes the source's catalog in the background after
          data queries, rate-limited per source.
        type: boolean
      name:
        type: string
      owner_id:
        type: string
      owner_type:
        description: OwnerType is "user" or "team" and, with OwnerID, names who is
          told when a run fails. Omit both to leave the owner unchanged; send both
          empty to clear it.
        type: string
      plugin_id:
        type: string
      queryable:
        description: |-
          Queryable lets agents and users query this source through Marmot; the
          plugin must support queries.
        type: boolean
    type: object
  CreateServiceAccountAPIKeyRequest:
    properties:
      expires_in_days:
        type: integer
      name:
        type: string
    type: object
  CreateServiceAccountRequest:
    properties:
      description:
        type: string
      name:
        type: string
      role_ids:
        items:
          type: string
        type: array
    type: object
  CreateStatRequest:
    properties:
      asset_mrn:
        type: string
      metric_name:
        type: string
      value:
        type: number
    required:
    - asset_mrn
    - metric_name
    - value
    type: object
  CreateTeamRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  CreateTermRequest:
    properties:
      definition:
        type: string
      description:
        type: string
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      owners:
        items:
          $ref: '#/definitions/OwnerRequest'
        type: array
      parent_term_id:
        type: string
      related_term_ids:
        description: RelatedTermIDs links the new term to existing terms, in both
          directions.
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
    required:
    - definition
    - name
    type: object
  CreateUserInput:
    properties:
      name:
        type: string
      oauth_provider:
        type: string
      oauth_provider_data:
        additionalProperties: true
        type: object
      oauth_provider_id:
        type: string
      password:
        minLength: 8
        type: string
      profile_picture:
        type: string
      role_names:
        items:
          type: string
        minItems: 1
        type: array
      username:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - name
    - role_names
    - username
    type: object
  CurrentUser:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      identities:
        items:
          $ref: '#/definitions/UserIdentity'
        type: array
      invite_expires_at:
        type: string
      job_title:
        type: string
      last_seen_at:
        description: LastSeenAt is refreshed at most every LastSeenInterval, so it
          is accurate to a few minutes.
        type: string
      must_change_password:
        type: boolean
      name:
        type: string
      preferences:
        additionalProperties: true
        type: object
      profile_picture:
        type: string
      role_sources:
        items:
          $ref: '#/definitions/ProfileRoleSource'
        type: array
      roles:
        items:
          $ref: '#/definitions/UserRole'
        type: array
      sessions_invalidated_at:
        description: Tokens issued before this moment are rejected at validation,
          so setting it to now signs the user out of every session at once.
        type: string
      status:
        description: Status is active, invited or deactivated. An invited member has
          an account waiting for them but has not used their link yet.
        type: string
      teams:
        items:
          $ref: '#/definitions/ProfileTeam'
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  DataProduct:
    properties:
      asset_count:
        type: integer
      asset_types:
        description: AssetTypes counts the product's assets by type and is only filled
          in by Get.
        items:
          $ref: '#/definitions/DataProductTypeCount'
        type: array
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      icon_url:
        type: string
      id:
        type: string
      manual_asset_count:
        type: integer
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      owners:
        items:
          $ref: '#/definitions/DataProductOwner'
        type: array
      popularity:
        description: Popularity is a level from 0 to 4 from its assets' views over
          the last 30 days. It is filled in by the filtered list and by Get.
        type: integer
      rule_asset_count:
        type: integer
      rules:
        items:
          $ref: '#/definitions/DataProductRule'
        type: array
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  DataProductAssetsResult:
    properties:
      asset_ids:
        items:
          type: string
        type: array
      total:
        type: integer
    type: object
  DataProductFacets:
    properties:
      owners:
        items:
          $ref: '#/definitions/DataProductOwnerFacet'
        type: array
      tags:
        items:
          $ref: '#/definitions/DataProductTagFacet'
        type: array
    type: object
  DataProductListResult:
    properties:
      data_products:
        items:
          $ref: '#/definitions/DataProduct'
        type: array
      total:
        type: integer
    type: object
  DataProductMember:
    properties:
      added_at:
        type: string
      asset_id:
        type: string
      description:
        type: string
      mrn:
        type: string
      name:
        type: string
      owner_names:
        items:
