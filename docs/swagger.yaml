      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PluginRun'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Start run
      tags:
      - runs
  /api/v1/search:
    get:
      description: Search across assets, glossary terms, teams, and users
      operationId: getSearch
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - collectionFormat: csv
        description: Filter by result types (asset, glossary, team, user)
        in: query
        items:
          type: string
        name: types
        type: array
      - description: Comma-separated asset types to filter assets by
        in: query
        name: asset_types
        type: string
      - description: Comma-separated providers to filter assets by
        in: query
        name: providers
        type: string
      - description: Comma-separated tags to filter by
        in: query
        name: tags
        type: string
      - description: Comma-separated user or team IDs; matches assets, glossary terms
          and data products they own
        in: query
        name: owner
        type: string
      - default: relevance
        description: Result order
        enum:
        - relevance
        - popular
        - updated
        - name
        in: query
        name: sort
        type: string
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Unified search
      tags:
      - search
