info:
  contact: {}
  description: API for interacting with Marmot
  license:
    name: MIT
    url: https://opensource.org/license/MIT
  title: Marmot API
  version: "0.1"
paths:
  /api/v1/admin/auth/providers:
    get:
      description: Every provider configured in the server config, whether it is switched
        on and how many members have signed in with it.
      operationId: getAdminAuthProviders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SSOProviderStatusList'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List single sign-on providers with their status
      tags:
      - admin
  /api/v1/admin/auth/providers/{type}:
    put:
      consumes:
      - application/json
      description: Providers are configured in the server config; this switches one
        off without removing its configuration, or back on. Members who signed in
        with it keep their accounts.
      operationId: putAdminAuthProvidersType
      parameters:
      - description: Provider type, such as okta
        in: path
        name: type
        required: true
        type: string
      - description: Whether the provider is on
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateSSOProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SSOProviderStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Switch a single sign-on provider on or off
      tags:
      - admin
  /api/v1/admin/auth/settings:
    get:
      description: Whether single sign-on creates new members, the role and team they
        start with, and whether members may sign in with a password.
      operationId: getAdminAuthSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SignInSettings'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get sign-in settings
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Replaces the sign-in settings. Administrators can always sign in
        with a password, so turning password sign-in off cannot lock everyone out;
        it is refused while no single sign-on provider is on.
      operationId: putAdminAuthSettings
      parameters:
      - description: Sign-in settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SignInSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SignInSettings'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update sign-in settings
      tags:
      - admin
  /api/v1/admin/search/reindex:
    get:
      description: Check whether a search reindex is currently running and whether
        Elasticsearch is configured.
      operationId: getAdminSearchReindex
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ReindexStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get reindex status
      tags:
      - admin
    post:
      description: Trigger a full reindex from PostgreSQL to Elasticsearch. The reindex
        runs asynchronously in the background. Only one reindex can run at a time.
      operationId: postAdminSearchReindex
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/ReindexAcceptedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Start search reindex
      tags:
      - admin
  /api/v1/admin/system:
    get:
      description: Product version and build, the Postgres version and the size of
        the search index. Admin only.
      operationId: getAdminSystem
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get system information
      tags:
      - admin
  /api/v1/agents/{asset_id}/activity:
    get:
      operationId: getAgentsAssetIDActivity
      parameters:
      - description: Agent asset id
        in: path
        name: asset_id
        required: true
        type: string
      - description: Lookback window (e.g. 24h, 7d). Default 24h.
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ActivityResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Agent activity
      tags:
      - agents
  /api/v1/agents/{asset_id}/runs:
    get:
      operationId: getAgentsAssetIDRuns
      parameters:
      - description: Agent asset id
        in: path
        name: asset_id
        required: true
        type: string
      - description: Lookback window (e.g. 24h, 7d). Default 24h.
        in: query
        name: period
        type: string
      - description: Max number of runs to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RunsResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List agent runs
      tags:
      - agents
  /api/v1/agents/{asset_id}/stats:
    get:
      operationId: getAgentsAssetIDStats
      parameters:
      - description: Agent asset id
        in: path
        name: asset_id
        required: true
        type: string
      - description: Lookback window (e.g. 24h, 7d). Default 24h.
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Stats'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Agent stats
      tags:
      - agents
  /api/v1/agents/runs:
    post:
      consumes:
      - application/json
      operationId: postAgentsRuns
      parameters:
      - description: Agent run record
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RecordRunRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AgentRun'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Record agent run
      tags:
      - agents
  /api/v1/asset-rules/:
    post:
      consumes:
      - application/json
      description: Create a new asset rule that applies enrichments to matching assets
      operationId: postAssetRules
      parameters:
      - description: Asset rule creation request
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/CreateAssetRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AssetRule'
        "400":
