      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission IDs to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_roles.replacePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Role'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
