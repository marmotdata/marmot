      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new API key for a user
      operationId: postUsersApikeys
      parameters:
      - description: API key creation request
        in: body
        name: key
        required: true
        schema:
          $ref: '#/definitions/CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKey'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create API key
      tags:
      - users
  /api/v1/users/apikeys/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an API key
      operationId: deleteUsersApikeysID
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete API key
      tags:
      - users
  /api/v1/users/apikeys/{id}/rotate:
    post:
      description: Issue a new secret for one of the current user's API keys, keeping
        its name and expiry. The old secret stops working at once and the new key
        is returned only in this response.
      operationId: postUsersApikeysIDRotate
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKey'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Rotate API key
      tags:
      - users
  /api/v1/users/invites:
    post:
      consumes:
      - application/json
      description: 'Creates a pending member with the given roles and teams and returns
        a one-time link for them to set a password. Marmot sends no email: pass the
        link on yourself. The link works for 7 days.'
      operationId: postUsersInvites
      parameters:
      - description: Who to invite
        in: body
        name: invite
        required: true
        schema:
          $ref: '#/definitions/InviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/InviteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Invite a member
      tags:
      - users
  /api/v1/users/invites/{id}:
    delete:
      description: Withdraws a pending invitation and removes the pending member it
        created.
      operationId: deleteUsersIDInvite
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Withdraw an invitation
      tags:
      - users
  /api/v1/users/invites/{id}/renew:
    post:
      description: Replaces a pending member's invitation link with a new one that
        works for another 7 days. The old link stops working.
      operationId: postUsersIDInvite
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/InviteResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Renew an invitation
      tags:
      - users
  /api/v1/users/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with username/email and password
      operationId: postUsersLogin
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Login user
      tags:
      - users
  /api/v1/users/me:
    get:
      consumes:
      - application/json
      description: Get detailed information about the currently authenticated user
      operationId: getUsersMe
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrentUser'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
  /api/v1/users/me/connected-apps:
    get:
      description: List the OAuth clients, such as MCP clients and the CLI, that the
        current user has allowed and that still hold a valid token
      operationId: getUsersMeConnectedApps
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConnectedAppsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List connected apps
      tags:
      - users
  /api/v1/users/me/connected-apps/{client_id}:
    delete:
      description: Revoke an OAuth client's access to the current user's account.
        Tokens already issued to it stop working at once; the client has to ask again
        to get back in.
      operationId: deleteUsersMeConnectedAppsClientID
      parameters:
      - description: OAuth client ID
        in: path
        name: client_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Revoke a connected app
      tags:
      - users
  /api/v1/users/me/profile:
    put:
      consumes:
      - application/json
      description: Update the profile fields the current user may set about themselves,
        such as job title
      operationId: putUsersMeProfile
      parameters:
      - description: Profile fields
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrentUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /api/v1/users/me/recent:
    get:
      description: 'Returns what the current person opened most recently in the UI:
        assets, glossary terms, data products and their saved queries, newest first,
        described as they are now. Items since deleted, and kinds the caller can no
        longer view, are left out. Callers without a user account get an empty list.'
      operationId: listRecentItems
      parameters:
      - default: 10
        description: Number of items, at most 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListRecentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List recently viewed items
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Notes that the current person opened an item, for their recently
        viewed list. Repeat views within a minute are ignored and only the latest
        50 items are kept. Callers without a user account are accepted and nothing
        is stored.
      operationId: recordRecentView
      parameters:
      - description: The item viewed
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RecordRecentViewRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Record a view
      tags:
      - users
  /api/v1/users/oauth/link:
    post:
      consumes:
      - application/json
      description: Link an OAuth account to an existing user
      operationId: postUsersOauthLink
      parameters:
      - description: OAuth account link request
        in: body
        name: link
        required: true
        schema:
          $ref: '#/definitions/OAuthLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Link OAuth account
      tags:
      - users
  /api/v1/users/oauth/unlink/{id}/{provider}:
    delete:
      consumes:
      - application/json
      description: Unlink an OAuth account from a user
      operationId: deleteUsersOauthUnlinkIDProvider
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: OAuth provider
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Unlink OAuth account
      tags:
      - users
  /api/v1/users/preferences:
    put:
      consumes:
      - application/json
      description: Update preferences for the current user
      operationId: putUsersPreferences
      parameters:
      - description: User preferences
        in: body
        name: preferences
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update user preferences
      tags:
      - users
  /api/v1/users/sign-out:
    post:
      description: 'Revokes the bearer token the request is sent with, so a copy of
        it stops working before it expires. Only that token is revoked: the person''s
        other sessions and API keys are untouched. A token that is already invalid
        has nothing left to revoke, so that is a 204 too.'
      operationId: postUsersSignOut
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sign out
      tags:
      - users
  /api/v1/users/sign-out-all/{id}:
    post:
      description: Rejects every token issued to the user before now. Their password
        and API keys are untouched, so this is the response to a leaked or overexposed
        token rather than a lost credential.
      operationId: postUsersIDSignOutAll
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Sign a user out of all sessions
      tags:
      - users
  /api/v1/users/update-password:
    post:
      consumes:
      - application/json
      description: Update current user's password
      operationId: postUsersUpdatePassword
      parameters:
      - description: Password update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update user password
      tags:
      - users
  /auth-providers:
    get:
      description: Returns the enabled auth providers without sensitive data
      operationId: getAuthProviders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthConfig'
      summary: Get auth configuration
      tags:
      - auth
  /auth/{provider}/callback:
    get:
      description: Processes the OAuth callback from any provider
      operationId: getAuthProviderCallback
      parameters:
      - description: OAuth provider (okta, google, github, etc.)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State parameter for CSRF protection
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Temporary Redirect
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Handle OAuth callback
      tags:
      - auth
  /auth/{provider}/login:
    get:
      description: Redirects the user to the OAuth provider for authentication
      operationId: getAuthProviderLogin
      parameters:
      - description: OAuth provider (okta, google, github, etc.)
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Temporary Redirect
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Initiate OAuth login
      tags:
      - auth
  /oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        Handles authorization_code grants (with PKCE) and token exchange (RFC 8693).
        For token-exchange, supported subject_token_type values are
        urn:ietf:params:oauth:token-type:id_token and urn:ietf:params:oauth:token-type:access_token.
      operationId: postOauthToken
      parameters:
      - description: authorization_code or urn:ietf:params:oauth:grant-type:token-exchange
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Token to exchange (token-exchange grant only)
        in: formData
        name: subject_token
        type: string
      - description: id_token or access_token URI (token-exchange grant only)
        in: formData
        name: subject_token_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TokenExchangeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/OAuthErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/OAuthErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/OAuthErrorResponse'
      summary: OAuth token endpoint
      tags:
      - auth
  /query/serve/enrol:
    post:
      consumes:
      - application/json
      description: Issues a short-lived client certificate for a plugin running outside
        Marmot to connect and serve queries for the named sources. The caller must
        hold ingestion:serve, and each source must be free or already served by the
        caller.
      parameters:
      - description: Certificate request and sources
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pluginserve.EnrolInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pluginserve.EnrolResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Enrol a serving plugin
      tags:
      - query
  /query/serve/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ServeKeyGeneration'
            type: array
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List serving key generations
      tags:
      - query
  /query/serve/keys/rotate:
    post:
      consumes:
      - application/json
      description: 'Starts a new generation of the CA and query signing keys that
        secure serving plugins. A graceful rotation publishes the new keys, uses them
        after the overlap and then retires the old ones, without interrupting serving
        plugins. An immediate rotation is for a suspected compromise: it switches
        at once and serving plugins must be restarted.'
      parameters:
      - description: Rotation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ServeRotateKeysRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ServeKeyGeneration'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Rotate serving keys
      tags:
      - query
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
