      - application/json
      description: Asks the people who can grant access for what a refused query needed,
        and notifies them in Marmot. Pass the refused query's id, or a source when
        there is no query. Asking again for the same access within a day returns the
        earlier request without notifying anyone again.
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/QueryAccessRequestInput'
      produces:
      - application/json
      responses:
        "200":
          description: An identical recent request
          schema:
            $ref: '#/definitions/QueryAccessRequest'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/QueryAccessRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Request query access
      tags:
      - query
  /api/v1/query/agents:
    get:
      description: Lists the service accounts agents query as, busiest first over
        the last 7 days, with queries and refusals in the last 24 hours and 7 days,
        the tables read and when each last queried. Pass principal_id for one account.
        Callers without access:view only see their own activity. Each row's principal_type
        and principal_id filter GET /query/history to that agent's queries.
      parameters:
      - description: One service account
        in: query
        name: principal_id
        type: string
      - default: 10
        description: At most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryAgentSummariesResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Summarise agents' queries
      tags:
      - query
  /api/v1/query/asset-stats:
    get:
      description: 'Summarises the queries through Marmot that read an asset over
        a window, the last 14 days by default: how many, how many distinct people
        and agents asked, the median run time, how many policy denied and a count
        per day. Callers without access:view see only their own queries.'
      parameters:
      - description: Asset MRN
        in: query
        name: mrn
        required: true
        type: string
      - description: Window start, RFC 3339; defaults to 14 days before to
        in: query
        name: from
        type: string
      - description: Window end, RFC 3339; defaults to now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryAssetStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Query stats for one asset
      tags:
      - query
  /api/v1/query/history:
    get:
      description: Lists the query log, newest first. Callers without access:view
        only see their own queries. Every filter can be passed in a link, so other
        pages can open the audit already filtered.
      parameters:
      - description: Only the query with this id
        in: query
        name: id
        type: string
      - description: Source name
        in: query
        name: source
        type: string
      - description: A caller as principal_type:principal_id or as its audit subject,
          such as user:alice
        in: query
        name: caller
        type: string
      - description: allowed (ran to completion), denied, failed, cancelled or running
        in: query
        name: outcome
        type: string
      - description: 'Outcome reason: role, permission, policy, source_error, timeout,
          unreachable or cancelled'
        in: query
        name: reason
        type: string
      - description: allowed or denied
        in: query
        name: decision
        type: string
      - description: running, completed, failed, cancelled or denied
        in: query
        name: status
        type: string
      - description: Only queries that referenced this MRN
        in: query
        name: mrn
        type: string
      - description: Principal type
        in: query
        name: principal_type
        type: string
      - description: Principal ID
        in: query
        name: principal_id
        type: string
      - description: Only the caller's own queries
        in: query
        name: mine
        type: boolean
      - description: 'Comma-separated clients to include: api, mcp, cli or editor'
        in: query
        name: client
        type: string
      - description: Only queries started at or after this time (RFC 3339)
        in: query
        name: from
        type: string
      - description: Only queries started before this time (RFC 3339)
        in: query
        name: to
        type: string
      - description: Matches the caller, agent, service account, source, statement
          or a referenced MRN
        in: query
        name: q
        type: string
      - default: 50
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List queries
      tags:
      - query
  /api/v1/query/history/{id}:
    get:
      description: Returns one query from the log, including the catalog context recorded
        when it ran. Callers without access:view can only read their own queries.
      parameters:
      - description: Query ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryRecord'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get a query
      tags:
      - query
  /api/v1/query/history/{id}/cancel:
    post:
      description: Stops a running query. The query must be the caller's own unless
        the caller holds access:manage. A query runs on one replica, which is the
        only one that can stop it; elsewhere this answers 409, and the caller can
        still stop its own query by closing the request that runs it.
      parameters:
      - description: Query ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The query is not running here
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Cancel a query
      tags:
      - query
  /api/v1/query/history/export:
    get:
      description: Streams the query log as CSV, newest first, with the same filters
        as the listing (limit and offset are ignored). Callers without access:view
        only export their own queries. At most 100,000 rows are written.
      parameters:
      - default: csv
        description: csv
        in: query
        name: format
        type: string
      - description: Only the query with this id
        in: query
        name: id
        type: string
      - description: Source name
        in: query
        name: source
        type: string
      - description: A caller as principal_type:principal_id or as its audit subject
        in: query
        name: caller
        type: string
      - description: allowed, denied, failed, cancelled or running
        in: query
        name: outcome
        type: string
      - description: Outcome reason
        in: query
        name: reason
        type: string
      - description: Comma-separated clients
        in: query
        name: client
        type: string
      - description: RFC 3339
        in: query
        name: from
        type: string
      - description: RFC 3339
        in: query
        name: to
        type: string
      - description: Search
        in: query
        name: q
        type: string
      - description: Only the caller's own queries
        in: query
        name: mine
        type: boolean
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Export queries
      tags:
      - query
  /api/v1/query/run:
    post:
      consumes:
      - application/json
      description: Runs a read-only statement against a queryable source as the caller.
        The statement is planned first and refused unless the caller may query every
        table it references. Every attempt is recorded in the query log.
      parameters:
      - description: Query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/QueryRunInput'
      - description: editor (or web) when the query comes from the web UI's query
          editor
        in: header
        name: X-Marmot-Client
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/QueryRefusedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The query was cancelled
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Run a query
      tags:
      - query
  /api/v1/query/saved:
    get:
      description: Lists the current person's saved queries, the most recently run
        or edited first.
      parameters:
      - default: 50
        description: Page size, at most 500
        in: query
        name: limit
        type: integer
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListSavedQueriesResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List saved queries
      tags:
      - query
    post:
      consumes:
      - application/json
      description: Saves a statement and the source it runs against for the current
        person to run again.
      parameters:
      - description: Saved query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SavedQueryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/SavedQuery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Save a query
      tags:
      - query
  /api/v1/query/saved/{id}:
    delete:
      description: Deletes one of the current person's saved queries. The query log
        keeps every run.
      parameters:
      - description: Saved query ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete a saved query
      tags:
      - query
    get:
      description: Returns one of the current person's saved queries.
      parameters:
      - description: Saved query ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SavedQuery'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get a saved query
      tags:
      - query
    put:
      consumes:
      - application/json
      description: Replaces the name, statement and source of one of the current person's
        saved queries.
      parameters:
      - description: Saved query ID
        in: path
        name: id
        required: true
        type: string
      - description: Saved query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SavedQueryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SavedQuery'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update a saved query
      tags:
      - query
  /api/v1/query/saved/{id}/run:
    post:
      description: Records that the current person ran a saved query, setting its
        last_run_at. The statement itself runs through POST /query/run, which checks
        access and logs it like any other.
      parameters:
      - description: Saved query ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SavedQuery'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Mark a saved query as run
      tags:
      - query
  /api/v1/query/sources:
    get:
      description: Pages through the sources that answer data queries, in name order.
        Use a source's name as the "source" of a query.
      parameters:
      - description: Search by source name or plugin
        in: query
        name: q
        type: string
      - default: 50
        description: Page size, at most 200
        in: query
        name: limit
        type: integer
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryListSourcesResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List queryable sources
      tags:
      - query
  /api/v1/query/sources/{name}/stats:
    get:
      description: 'Counts a source''s queries over a window, the last seven days
        by default: how many were asked, refused by policy and failed at the source.
        Callers without access:view see only their own queries.'
      parameters:
      - description: Source name
        in: path
        name: name
        required: true
        type: string
      - description: Window start, RFC 3339; defaults to seven days before to
        in: query
        name: from
        type: string
      - description: Window end, RFC 3339; defaults to now
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QuerySourceStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Query stats for one source
      tags:
      - query
  /api/v1/query/sources/{name}/tables:
    get:
      description: Lists the catalogued tables a queryable source can reach, busiest
        first, each with a statement that previews it in the source's own dialect.
      parameters:
      - description: Source name
        in: path
        name: name
        required: true
        type: string
      - description: Search by table name
        in: query
        name: q
        type: string
      - default: 25
        description: At most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/QuerySourceTable'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List a source's tables
      tags:
      - query
  /api/v1/query/stats:
    get:
      description: 'Summarises data query activity over a window from hourly rollups:
        totals, a series and the busiest callers, sources and tables. Callers without
        access:view only see their own activity. The window defaults to the last 24
        hours.'
      parameters:
      - description: Start of the window, RFC 3339
        in: query
        name: from
        type: string
      - description: End of the window, RFC 3339
        in: query
        name: to
        type: string
      - description: hour or day; defaults by window length
        in: query
        name: interval
        type: string
      - default: 6
        description: Entries in each top list
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Query statistics
      tags:
      - query
  /api/v1/query/status:
    get:
      description: Reports the long-running plugin processes that serve data queries.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/QueryStatusResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Query plugin instance status
      tags:
      - query
  /api/v1/roles:
    get:
      description: List all active roles with user counts and permissions
