name: Test Go SDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install dev dependencies
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          go install github.com/go-swagger/go-swagger/cmd/swagger@v0.36.5
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.9.0

      - name: Generate Go SDK
        run: make sdk-go-generate

      - name: Lint Go SDK
        run: make sdk-go-lint

      - name: Build Go SDK
        run: make sdk-go-build

      - name: Run Go SDK tests
        run: make sdk-go-test
