name: Sync upstream main

# Keeps the fork's `main` a bit-for-bit mirror of marmotdata/marmot's `main`.
# Resets rather than merges, so it self-heals even if a Sync-fork click,
# a stray PR, or a manual push ever put something else on `main`.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # If branch protection restricts pushes to main to a specific
          # actor/App, the default GITHUB_TOKEN won't be enough — use a
          # bot PAT stored as a secret and listed in that push restriction.
          # token: ${{ secrets.MIRROR_PUSH_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/marmotdata/marmot.git

      - name: Fetch upstream
        run: git fetch upstream main --quiet

      - name: Check whether main already matches upstream/main
        id: diff
        run: |
          if git diff --quiet upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset main to upstream/main exactly
        if: steps.diff.outputs.changed == 'true'
        run: git reset --hard upstream/main

      - name: Push mirror (force-with-lease)
        if: steps.diff.outputs.changed == 'true'
        run: git push origin main --force-with-lease
