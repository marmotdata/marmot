name: Sync upstream into main

# Runs from the default branch (dgu). Pushes fast-forwards to origin/main only.
# Do not use GitHub "Sync fork": that would merge upstream into dgu.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-forward-main:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward origin/main to marmotdata/marmot main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream https://github.com/marmotdata/marmot.git
          git fetch origin main
          git fetch upstream main
          git checkout -B main origin/main
          git merge --ff-only upstream/main
          git push origin main
