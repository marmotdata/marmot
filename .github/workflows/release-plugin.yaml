name: Release Plugin
run-name: ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "plugins/*/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Plugin tag to release (e.g. plugins/kafka/v0.1.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/plugins

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Parse tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ref="${TAG}"
          rest="${ref#plugins/}"
          plugin="${rest%%/*}"
          version="${rest#*/v}"
          workdir="plugins/${plugin}"
          if [ ! -d "${workdir}" ]; then
            echo "No plugin directory at ${workdir}" >&2
            exit 1
          fi
          {
            echo "plugin=${plugin}"
            echo "version=${version}"
            echo "workdir=${workdir}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.meta.outputs.workdir }}/go.mod
          cache: true
          cache-dependency-path: ${{ steps.meta.outputs.workdir }}/go.sum

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run tests
        working-directory: ${{ steps.meta.outputs.workdir }}
        run: go test ./...

      - name: Detect cgo plugin
        id: cgo
        run: |
          if grep -q "CGO_ENABLED=1" "${{ steps.meta.outputs.workdir }}/.goreleaser.yaml"; then
            echo "cgo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cgo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        if: steps.cgo.outputs.cgo != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=validate
          workdir: ${{ steps.meta.outputs.workdir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.meta.outputs.version }}

      # cgo plugins need cross toolchains for the darwin builds.
      - name: Run GoReleaser (cgo)
        if: steps.cgo.outputs.cgo == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.meta.outputs.version }}
        run: |
          docker run --rm \
            -e CGO_ENABLED=1 \
            -e GITHUB_TOKEN \
            -e GORELEASER_CURRENT_TAG \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e COSIGN_YES=true \
            -v "$PWD:/workspace" \
            -w "/workspace/${{ steps.meta.outputs.workdir }}" \
            --entrypoint /bin/sh \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.0 -c \
            'git config --global --add safe.directory /workspace && goreleaser release --clean --skip=validate'

      - name: Log in to GHCR
        run: |
          mkdir -p ~/.docker
          echo '{"auths":{"ghcr.io":{"auth":"'"$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)"'"}}}' > ~/.docker/config.json

      - name: Push plugin OCI artefacts
        id: push
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
          WORKDIR: ${{ steps.meta.outputs.workdir }}
        run: |
          set -euo pipefail
          output=$(go run ./cmd plugin push \
            "${REGISTRY}/${PLUGIN}:${VERSION}" \
            --source "${WORKDIR}" \
            --dist "${WORKDIR}/dist" \
            --repo-url "https://github.com/${{ github.repository }}" \
            | tee /dev/stderr)
          {
            echo "index_digest=$(awk '$1=="index:"{print $2}' <<<"$output")"
            echo "info_digest=$(awk '$1=="info:"{print $2}' <<<"$output")"
          } >> "$GITHUB_OUTPUT"

      - name: Sign OCI artefacts
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          INDEX_DIGEST: ${{ steps.push.outputs.index_digest }}
          INFO_DIGEST: ${{ steps.push.outputs.info_digest }}
        run: |
          set -euo pipefail
          REPO="${REGISTRY}/${PLUGIN}"
          cosign sign --yes "${REPO}@${INDEX_DIGEST}"
          cosign sign --yes "${REPO}@${INFO_DIGEST}"

      - name: Release summary
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
          INDEX_DIGEST: ${{ steps.push.outputs.index_digest }}
        run: |
          {
            echo "### ${PLUGIN} ${VERSION}"
            echo '```json'
            echo "\"${PLUGIN}\": { \"version\": \"${VERSION}\", \"digest\": \"${INDEX_DIGEST}\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
