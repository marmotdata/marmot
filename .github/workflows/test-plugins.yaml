name: Test Plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".github/workflows/test-plugins.yaml"
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/test-plugins.yaml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List plugins
        id: list
        run: |
          plugins=$(find plugins -mindepth 2 -maxdepth 2 -name go.mod -printf '%h\n' | xargs -n1 basename | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache: true
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
