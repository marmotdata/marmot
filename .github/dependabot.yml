version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: "weekly"
  plugins:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/server"]

  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/sdk"]

  - package-ecosystem: "npm"
    directories:
      - "/web/marmot"
      - "/web/docs"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/frontend"]

  - package-ecosystem: "npm"
    directory: "/sdk/ts"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/sdk"]

  - package-ecosystem: "uv"
    directory: "/sdk/python"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/sdk"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/build"]

  # plugins a-d
  - package-ecosystem: "gomod"
    directories:
      - "/plugins/a*"
      - "/plugins/b*"
      - "/plugins/c*"
      - "/plugins/d*"
    multi-ecosystem-group: "plugins"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/plugins"]
    # 2.14+ makes schemaregistry import the cgo-only kafka package, and plugins build with CGO_ENABLED=0.
    ignore:
      - dependency-name: "github.com/confluentinc/confluent-kafka-go/v2"
        versions: [">=2.14.0"]

  # plugins e-l
  - package-ecosystem: "gomod"
    directories:
      - "/plugins/e*"
      - "/plugins/f*"
      - "/plugins/g*"
      - "/plugins/h*"
      - "/plugins/i*"
      - "/plugins/k*"
      - "/plugins/l*"
    multi-ecosystem-group: "plugins"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/plugins"]
    # 2.14+ makes schemaregistry import the cgo-only kafka package, and plugins build with CGO_ENABLED=0.
    ignore:
      - dependency-name: "github.com/confluentinc/confluent-kafka-go/v2"
        versions: [">=2.14.0"]

  # plugins m-p
  - package-ecosystem: "gomod"
    directories:
      - "/plugins/m*"
      - "/plugins/n*"
      - "/plugins/o*"
      - "/plugins/p*"
    multi-ecosystem-group: "plugins"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/plugins"]

  # plugins q-v
  - package-ecosystem: "gomod"
    directories:
      - "/plugins/q*"
      - "/plugins/r*"
      - "/plugins/s*"
      - "/plugins/t*"
      - "/plugins/u*"
      - "/plugins/v*"
    multi-ecosystem-group: "plugins"
    patterns: ["*"]
    labels: ["dependencies", "kind/dependency", "area/plugins"]
    # 2.14+ makes schemaregistry import the cgo-only kafka package, and plugins build with CGO_ENABLED=0.
    ignore:
      - dependency-name: "github.com/confluentinc/confluent-kafka-go/v2"
        versions: [">=2.14.0"]
