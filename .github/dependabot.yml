version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"
      - "area/server"
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-other:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"
      - "area/sdk"
    groups:
      go-sdk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-sdk-other:
        patterns: ["*"]
      go-sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/web/marmot"
      - "/web/docs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"
      - "area/frontend"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-other:
        patterns: ["*"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/sdk/ts"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"
      - "area/sdk"
    groups:
      ts-sdk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ts-sdk-other:
        patterns: ["*"]
      ts-sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"
      - "area/sdk"
    groups:
      python-sdk:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-sdk-other:
        patterns: ["*"]
      python-sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"
      - "area/build"
    groups:
      actions:
        patterns: ["*"]
