version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "kind/dependency"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/server"
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/sdk"
    groups:
      go-sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/plugins/*"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/plugins"
    groups:
      plugins-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/web/marmot"
      - "/web/docs"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/frontend"
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/sdk/ts"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/sdk"
    groups:
      ts-sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/sdk/python"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/sdk"
    groups:
      python-sdk-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    labels:
      - "area/build"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
