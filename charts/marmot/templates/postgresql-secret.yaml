{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (include "marmot.postgresqlSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marmot.postgresqlSecretName" . }}
  labels:
    {{- include "marmot.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  {{ .Values.postgresql.auth.passwordKey }}: {{ if $secret }}{{ index $secret.data .Values.postgresql.auth.passwordKey }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
