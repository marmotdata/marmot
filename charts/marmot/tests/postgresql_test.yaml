suite: test embedded PostgreSQL
templates:
  - postgresql-secret.yaml
  - postgresql-service.yaml
  - postgresql-headless-service.yaml
  - postgresql-statefulset.yaml
tests:
  - it: should not render PostgreSQL resources when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a single PostgreSQL instance with persistent storage
    set:
      postgresql.enabled: true
    asserts:
      - isKind:
          of: Secret
        template: postgresql-secret.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-marmot-postgresql
        template: postgresql-secret.yaml
      - equal:
          path: spec.clusterIP
          value: None
        template: postgresql-headless-service.yaml
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-marmot-postgresql-hl
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add[0]
          value: CHOWN
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add[1]
          value: FOWNER
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 8Gi
        template: postgresql-statefulset.yaml

  - it: should use supplied credentials without rendering a password secret
    set:
      postgresql.enabled: true
      postgresql.auth.existingSecret: postgres-credentials
      postgresql.auth.passwordKey: postgres-password
    asserts:
      - hasDocuments:
          count: 0
        template: postgresql-secret.yaml
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: postgres-credentials
        template: postgresql-statefulset.yaml
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: /run/secrets/postgresql/postgres-password
        template: postgresql-statefulset.yaml

  - it: should use emptyDir storage when persistence is disabled
    set:
      postgresql.enabled: true
      postgresql.persistence.enabled: false
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
        template: postgresql-statefulset.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
        template: postgresql-statefulset.yaml
