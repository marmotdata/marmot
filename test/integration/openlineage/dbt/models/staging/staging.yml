version: 2
models:
  - name: stg_customers
    description: Cleaned customers.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_name
      - name: country
  - name: stg_orders
    description: Cleaned orders.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: ordered_at
      - name: status
      - name: amount
